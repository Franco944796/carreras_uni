<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<title>Correlativas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Mapa de correlativas</div>
    <h1 class="title"><span id="icon"></span><span class="pick" id="pick"><select id="career" aria-label="Elegir carrera"></select></span><span id="plan" class="plan"></span></h1>
    <div class="sub">Tocá una materia para cambiar su estado: pendiente, regular o aprobada.</div>
  </div>
  <div class="stats">
    <div class="bar"><i class="a" id="pa"></i><i class="r" id="pr"></i></div>
    <span id="pt" class="pt"></span>
    <button id="rs">Reiniciar</button>
  </div>
</header>
<div class="legend"><span class="l1">Aprobada</span><span class="lr">Regular (sin final)</span><span class="l2">Disponible para cursar</span><span class="l3">Bloqueada</span></div>
<details class="info">
  <summary>Cómo funciona y supuestos</summary>
  <div class="cols">
    <div><h2>Cómo funciona</h2><ul id="how"></ul></div>
    <div id="notes-box"><h2>Supuestos de esta carrera</h2><ul id="notes"></ul></div>
  </div>
</details>
<div class="scroll"><div id="map"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
