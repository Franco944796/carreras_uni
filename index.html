<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Correlativas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div><h1 id="title"></h1><div class="sub">Tocá una materia para cambiar su estado: pendiente, regular (cursada aprobada sin final) o aprobada.</div></div>
  <div class="stats">
    <select id="career" hidden></select>
    <div class="bar"><i class="a" id="pa"></i><i class="r" id="pr"></i></div>
    <span id="pt" style="font-size:13px"></span>
    <button id="rs">Reiniciar</button>
  </div>
</header>
<div class="legend"><span class="l1">Aprobada</span><span class="lr">Regular (sin final)</span><span class="l2">Disponible para cursar</span><span class="l3">Bloqueada</span><span style="margin-left:auto">Pasá el mouse sobre una materia para ver sus vínculos</span></div>
<div class="scroll"><div id="map"></div></div>
<div class="note" id="note"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
